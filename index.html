<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lobot.io</title>
  <meta name="description" content="homelab, on purpose.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/colors_and_type.css">
  <link rel="stylesheet" href="style.css">
  <script>
    (function () {
      var t = localStorage.getItem('lobot-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    }());
  </script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand" aria-label="lobot.io">
      <span aria-hidden="true">$_</span><span class="dim">lobot.io</span>
    </a>
    <nav class="nav" aria-label="site navigation">
      <button class="theme-btn" id="theme-btn" aria-label="toggle theme">◐ dark</button>
    </nav>
  </div>
</header>

<div class="shell">
  <section class="hero" aria-label="lobot.io">
    <div class="promptline" aria-hidden="true">
      <span class="prompt-tok">lobot:~$</span>
      <span class="cursor-block"></span>
    </div>
  </section>

  <footer class="footer">
    <span>// lobot.io &middot; 2026</span>
    <span><a href="https://github.com/lobot-io" rel="noopener noreferrer">github</a></span>
  </footer>
</div>

<script>
  (function () {
    var btn = document.getElementById('theme-btn');
    var html = document.documentElement;
    function applyTheme(t) {
      html.setAttribute('data-theme', t);
      localStorage.setItem('lobot-theme', t);
      btn.textContent = t === 'dark' ? '◐ dark' : '◑ light';
    }
    btn.addEventListener('click', function () {
      applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });
    var saved = localStorage.getItem('lobot-theme') || 'dark';
    btn.textContent = saved === 'dark' ? '◐ dark' : '◑ light';
  }());
</script>

</body>
</html>
